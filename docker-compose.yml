version: "3.9"

services:
  # ── Redis (STM + Message Bus) ─────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: aios-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aios-net

  # ── ChromaDB (LTM Vector Store) ───────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: aios-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ALLOW_RESET=true
      - ANONYMIZED_TELEMETRY=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - aios-net

  # ── AIOS Gateway ──────────────────────────────────────────────
  aios-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: aios-gateway
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - AIOS_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - aios-net
    restart: unless-stopped

  # ── Prometheus (Metrics) ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: aios-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - aios-net
    profiles: ["monitoring"]

  # ── Grafana (Dashboard) ───────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: aios-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - aios-net
    profiles: ["monitoring"]

volumes:
  redis_data:
  chroma_data:
  prometheus_data:
  grafana_data:

networks:
  aios-net:
    driver: bridge
